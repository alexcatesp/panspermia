[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "panspermia"
version = "0.0.1"
description = "Ecosistema de vida artificial distribuido con neuroevolución y plasticidad hebbiana"
readme = "README.md"
license = "Apache-2.0"
requires-python = ">=3.11"
authors = [{ name = "Alejandro Catalá Espí" }]
dependencies = [
  "jax[cuda12]",
  "flax",
  "chex",
  "jaxtyping",
  "orbax-checkpoint",
  "msgpack",
  "zstandard",
  "blake3",
  "pyarrow",
  "duckdb",
]

[project.optional-dependencies]
dev = ["pytest", "ruff", "hypothesis"]
net = ["grpcio", "fastapi", "uvicorn", "cryptography"]
mjx = ["mujoco", "mujoco-mjx", "playground"]

[tool.hatch.build.targets.wheel]
packages = ["src/panspermia"]

[tool.ruff]
line-length = 100
