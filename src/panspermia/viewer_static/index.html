<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Panspermia · Visor</title>
<style>
  :root {
    --bg: #050d14; --panel: #0b1824; --line: #1b2c3b; --ink: #d9e6ef; --muted: #7d93a6;
    --accent: #5fd4c4; --warn: #ff6b5a; --food: #3f8f4a;
    --mono: ui-monospace, "Cascadia Code", "SF Mono", Menlo, Consolas, monospace;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; background: var(--bg); color: var(--ink);
    font: 14px/1.45 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; }
  header { display: flex; align-items: baseline; gap: 16px; padding: 12px 16px; border-bottom: 1px solid var(--line); flex-wrap: wrap; }
  header h1 { font-size: 16px; margin: 0; letter-spacing: .04em; }
  header .meta { color: var(--muted); font-family: var(--mono); font-size: 12px; }
  main { display: grid; grid-template-columns: minmax(0, 1fr) 300px; gap: 16px; padding: 16px; }
  @media (max-width: 900px) { main { grid-template-columns: 1fr; } }
  .stage { position: relative; background: #02080d; border: 1px solid var(--line); border-radius: 8px; overflow: hidden; aspect-ratio: 1 / 1; max-height: calc(100vh - 140px); margin: 0 auto; width: 100%; }
  canvas#world { width: 100%; height: 100%; display: block; cursor: crosshair; }
  .overlay { position: absolute; left: 10px; top: 8px; font-family: var(--mono); font-size: 12px; color: var(--muted); pointer-events: none; }
  .empty { position: absolute; inset: 0; display: grid; place-items: center; color: var(--muted); text-align: center; padding: 24px; }
  aside { display: flex; flex-direction: column; gap: 12px; }
  .card { background: var(--panel); border: 1px solid var(--line); border-radius: 8px; padding: 12px; }
  .card h2 { font-size: 12px; text-transform: uppercase; letter-spacing: .08em; color: var(--muted); margin: 0 0 8px; font-weight: 600; }
  label { display: flex; align-items: center; gap: 8px; margin: 6px 0; color: var(--ink); }
  select, button, input[type=range] { font: inherit; }
  select, button { background: #0f2131; color: var(--ink); border: 1px solid var(--line); border-radius: 6px; padding: 5px 8px; }
  button { cursor: pointer; min-width: 40px; }
  button:hover, select:hover { border-color: var(--accent); }
  button.primary { background: var(--accent); color: #032; border-color: var(--accent); font-weight: 600; }
  .row { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; }
  input[type=range] { width: 100%; accent-color: var(--accent); }
  .kv { display: grid; grid-template-columns: auto 1fr; gap: 2px 10px; font-family: var(--mono); font-size: 12px; }
  .kv dt { color: var(--muted); } .kv dd { margin: 0; text-align: right; }
  .legend { display: grid; gap: 4px; font-size: 12px; color: var(--muted); }
  .legend span::before { content: ""; display: inline-block; width: 10px; height: 10px; border-radius: 50%; margin-right: 6px; vertical-align: -1px; background: var(--c); }
  .charts { padding: 0 16px 24px; display: grid; grid-template-columns: repeat(auto-fill, minmax(280px, 1fr)); gap: 12px; }
  .chart { background: var(--panel); border: 1px solid var(--line); border-radius: 8px; padding: 10px 12px; }
  .chart h3 { margin: 0 0 6px; font-size: 12px; color: var(--muted); font-weight: 600; display: flex; justify-content: space-between; }
  .chart h3 b { color: var(--ink); font-family: var(--mono); font-weight: 500; }
  .chart canvas { width: 100%; height: 110px; display: block; }
  .hint { color: var(--muted); font-size: 12px; }
  kbd { font-family: var(--mono); font-size: 11px; border: 1px solid var(--line); border-radius: 4px; padding: 0 4px; }
</style>
</head>
<body>
<header>
  <h1>PANSPERMIA · la pecera</h1>
  <span class="meta" id="runmeta">cargando…</span>
</header>
<main>
  <div>
    <div class="stage" id="stage">
      <canvas id="world" width="1024" height="1024" aria-label="Mundo de la isla"></canvas>
      <div class="overlay" id="hud"></div>
      <div class="empty" id="empty">Sin grabaciones todavía.<br>El runner graba una época cada 50.</div>
    </div>
  </div>
  <aside>
    <div class="card">
      <h2>Grabación</h2>
      <div class="row"><select id="rec" aria-label="Grabación"></select></div>
      <div class="row" style="margin-top:8px">
        <button id="play" class="primary" aria-label="Reproducir o pausar">▶</button>
        <button id="back" aria-label="Fotograma anterior">◀︎</button>
        <button id="fwd" aria-label="Fotograma siguiente">▶︎</button>
        <select id="speed" aria-label="Velocidad">
          <option value="0.25">0,25×</option><option value="0.5">0,5×</option>
          <option value="1" selected>1×</option><option value="2">2×</option><option value="4">4×</option>
        </select>
      </div>
      <input type="range" id="scrub" min="0" max="0" value="0" aria-label="Fotograma">
      <div class="hint"><kbd>espacio</kbd> reproducir · <kbd>←</kbd><kbd>→</kbd> fotograma · clic: ficha</div>
    </div>
    <div class="card">
      <h2>Vista</h2>
      <label>Color
        <select id="color">
          <option value="kin">color de parentesco</option>
          <option value="clade">clado</option>
          <option value="energy">energía</option>
        </select>
      </label>
      <label><input type="checkbox" id="showRes" checked> comida (algas)</label>
      <label><input type="checkbox" id="showSig"> señales</label>
      <label><input type="checkbox" id="showAct" checked> comer / morder</label>
      <label><input type="checkbox" id="showChem" checked> química (toxina · nutriente · feromona)</label>
      <div class="legend">
        <span style="--c:#ff6b5a">mordiendo (cuña) · mordido (anillo)</span>
        <span style="--c:#8be38f">comiendo (punto) · <b style="color:#ffd166">alga tóxica</b></span>
        <span style="--c:#c77dff">emitiendo toxina (anillo)</span>
        <span style="--c:#ffffff">seleccionado</span>
      </div>
    </div>
    <div class="card">
      <h2>Ficha</h2>
      <div id="card" class="hint">Haz clic en un bichito.</div>
    </div>
  </aside>
</main>
<section class="charts" id="charts"></section>

<script>
"use strict";
const $ = (id) => document.getElementById(id);
const canvas = $("world"), ctx = canvas.getContext("2d");
const resCanvas = document.createElement("canvas"), resCtx = resCanvas.getContext("2d");
const S = { rec: null, frame: 0, playing: false, speed: 1, acc: 0, last: 0, sel: null, run: null };

async function json(url) { const r = await fetch(url); if (!r.ok) throw new Error(url); return r.json(); }

async function loadRun() {
  const run = await json("/api/run");
  S.run = run;
  const m = run.meta || {};
  let node = m.node_id ?? "?";
  if (/^([0-9a-f]{2})+$/.test(node)) {
    const txt = node.match(/../g).map((h) => String.fromCharCode(parseInt(h, 16))).join("");
    if (/^[\x20-\x7e]+$/.test(txt)) node = txt;
  }
  $("runmeta").textContent = `${run.name} · semilla ${m.seed ?? "?"} · nodo ${node} · N=${m.n_max ?? "?"} · sustrato ${m.substrate_version ?? "?"}`;
  const sel = $("rec");
  sel.innerHTML = "";
  for (const name of run.recordings) {
    const o = document.createElement("option");
    o.value = name; o.textContent = "época " + parseInt(name.split("_")[1], 10);
    sel.appendChild(o);
  }
  $("empty").style.display = run.recordings.length ? "none" : "grid";
  if (run.recordings.length) { sel.value = run.recordings[run.recordings.length - 1]; await loadRecording(sel.value); }
  loadStats();
}

async function loadRecording(name) {
  S.playing = false; $("play").textContent = "▶";
  $("hud").textContent = "cargando " + name + "…";
  const header = await json(`/data/recordings/${name}.json`);
  const resp = await fetch(`/data/recordings/${name}.bin.gz`);
  const buf = await new Response(resp.body.pipeThrough(new DecompressionStream("gzip"))).arrayBuffer();
  const T = { uint8: Uint8Array, uint16: Uint16Array, uint32: Uint32Array, u1: Uint8Array, u2: Uint16Array, u4: Uint32Array };
  const A = {};
  for (const [k, d] of Object.entries(header.arrays)) {
    const Ctor = T[d.dtype] || Uint8Array;
    const n = d.shape.reduce((a, b) => a * b, 1);
    A[k] = new Ctor(buf.slice(d.offset, d.offset + n * Ctor.BYTES_PER_ELEMENT));
    A[k].shape = d.shape;
  }
  const [F, N] = A.pos.shape;
  S.rec = { name, meta: header.meta, A, F, N, R: A.resources.shape };
  $("scrub").max = F - 1;
  S.frame = 0;
  resCanvas.width = S.rec.R[1]; resCanvas.height = S.rec.R[2];
  draw();
}

function hueOf(u) { let x = u >>> 0; x = Math.imul(x ^ (x >>> 16), 0x45d9f3b); x ^= x >>> 16; return x % 360; }
function energyColor(e) { const t = e / 255; const r = 255, g = Math.round(60 + 195 * t), b = Math.round(40 + 215 * Math.max(0, t - .6) / .4); return `rgb(${Math.round(120 + 135 * t)},${g},${b})`; }

function agentColor(A, idx, mode) {
  if (mode === "clade") return `hsl(${hueOf(A.clade[idx])} 70% 62%)`;
  if (mode === "energy") return energyColor(A.energy[idx]);
  const c = 3 * idx; return `rgb(${A.color[c]},${A.color[c + 1]},${A.color[c + 2]})`;
}

function draw() {
  const R = S.rec; const W = canvas.width; const k = W / 65535;
  ctx.fillStyle = "#02080d"; ctx.fillRect(0, 0, W, W);
  if (!R) return;
  const { A, F, N, meta } = R; const f = S.frame;
  if ($("showRes").checked) {
    const [RF, RX, RY] = R.R;
    const ri = Math.min(RF - 1, Math.floor((f + 1) * meta.stride / meta.res_stride) - 1 < 0 ? 0 : Math.floor((f + 1) * meta.stride / meta.res_stride) - 1);
    const img = resCtx.createImageData(RX, RY); const base = ri * RX * RY;
    for (let x = 0; x < RX; x++) for (let y = 0; y < RY; y++) {
      const v = A.resources[base + x * RY + y] / 255; const p = 4 * (y * RX + x);
      img.data[p] = 4 + 30 * v; img.data[p + 1] = 18 + 120 * v; img.data[p + 2] = 24 + 40 * v; img.data[p + 3] = 255;
    }
    if (A.chem && $("showChem").checked) {
      const cbase = ri * 3 * RX * RY, plane = RX * RY;
      for (let x = 0; x < RX; x++) for (let y = 0; y < RY; y++) {
        const q = x * RY + y, p = 4 * (y * RX + x);
        const nut = A.chem[cbase + q] / 255, tox = A.chem[cbase + plane + q] / 255, phe = A.chem[cbase + 2 * plane + q] / 255;
        img.data[p] = Math.min(255, img.data[p] + 230 * tox + 200 * nut);
        img.data[p + 1] = Math.min(255, img.data[p + 1] + 170 * nut);
        img.data[p + 2] = Math.min(255, img.data[p + 2] + 220 * phe);
      }
    }
    resCtx.putImageData(img, 0, 0);
    ctx.imageSmoothingEnabled = true; ctx.drawImage(resCanvas, 0, 0, W, W);
  }
  const mode = $("color").value, showSig = $("showSig").checked, showAct = $("showAct").checked;
  const off = f * N; let alive = 0, selIdx = -1;
  for (let i = 0; i < N; i++) {
    const idx = off + i; const fl = A.flags[idx];
    if (!(fl & 128)) continue;
    alive++;
    const x = A.pos[2 * idx] * k, y = A.pos[2 * idx + 1] * k;
    const r = Math.max(1.5, A.radius[idx] / 16) * (W / 1024);
    const ang = A.angle[idx] / 255 * 2 * Math.PI;
    if (showSig) {
      const s = (A.signal[idx] - 127.5) / 127.5;
      ctx.beginPath(); ctx.arc(x, y, r * 3, 0, 2 * Math.PI);
      ctx.fillStyle = s > 0 ? `rgba(120,190,255,${0.35 * s})` : `rgba(255,170,90,${-0.35 * s})`; ctx.fill();
    }
    ctx.beginPath(); ctx.arc(x, y, r, 0, 2 * Math.PI);
    ctx.fillStyle = agentColor(A, idx, mode); ctx.fill();
    ctx.strokeStyle = "rgba(0,0,0,.6)"; ctx.lineWidth = 1;
    ctx.beginPath(); ctx.moveTo(x, y); ctx.lineTo(x + Math.cos(ang) * r * 1.6, y + Math.sin(ang) * r * 1.6); ctx.stroke();
    if (showAct) {
      if (fl & 2) { ctx.beginPath(); ctx.moveTo(x, y); ctx.arc(x, y, r * 2.2, ang - .45, ang + .45); ctx.closePath(); ctx.fillStyle = "rgba(255,107,90,.55)"; ctx.fill(); }
      if (fl & 4) { ctx.beginPath(); ctx.arc(x, y, r + 2, 0, 2 * Math.PI); ctx.strokeStyle = "#ff6b5a"; ctx.lineWidth = 1.5; ctx.stroke(); }
      if (fl & 1) { ctx.beginPath(); ctx.arc(x, y, Math.max(1, r * .35), 0, 2 * Math.PI); ctx.fillStyle = fl & 16 ? "#ffd166" : "#8be38f"; ctx.fill(); }
      if (fl & 8) { ctx.beginPath(); ctx.arc(x, y, r + 4, 0, 2 * Math.PI); ctx.strokeStyle = "#c77dff"; ctx.lineWidth = 1; ctx.stroke(); }
    }
    if (S.sel !== null && A.uid[idx] === S.sel) selIdx = idx;
  }
  if (selIdx >= 0) {
    const x = A.pos[2 * selIdx] * k, y = A.pos[2 * selIdx + 1] * k;
    ctx.beginPath(); ctx.arc(x, y, 14, 0, 2 * Math.PI); ctx.strokeStyle = "#fff"; ctx.lineWidth = 2; ctx.stroke();
  }
  const step = (f + 1) * meta.stride;
  $("hud").textContent = `época ${meta.epoch} · paso ${step}/${meta.steps} · vivos ${alive}`;
  $("scrub").value = f;
  renderCard(selIdx);
}

function renderCard(idx) {
  const el = $("card");
  if (S.sel === null) { el.className = "hint"; el.textContent = "Haz clic en un bichito."; return; }
  if (idx < 0) { el.className = "hint"; el.textContent = `#${S.sel}: no está vivo en este fotograma (murió o aún no ha nacido).`; return; }
  const A = S.rec.A; const fl = A.flags[idx];
  const acts = [fl & 1 ? "come" : null, fl & 2 ? "muerde" : null, fl & 4 ? "es mordido" : null].filter(Boolean).join(", ") || "—";
  const c = 3 * idx;
  el.className = "";
  el.innerHTML = `<dl class="kv">
    <dt>id</dt><dd>#${A.uid[idx]}</dd>
    <dt>clado</dt><dd>#${A.clade[idx]}</dd>
    <dt>energía</dt><dd>${(A.energy[idx] / 255 * 100).toFixed(0)}</dd>
    <dt>radio</dt><dd>${(A.radius[idx] / 16).toFixed(1)}</dd>
    <dt>señal</dt><dd>${((A.signal[idx] - 127.5) / 127.5).toFixed(2)}</dd>
    <dt>acción</dt><dd>${acts}</dd>
    <dt>color</dt><dd><span style="display:inline-block;width:28px;height:10px;border-radius:3px;background:rgb(${A.color[c]},${A.color[c+1]},${A.color[c+2]})"></span></dd>
  </dl>`;
}

canvas.addEventListener("click", (ev) => {
  if (!S.rec) return;
  const rect = canvas.getBoundingClientRect();
  const wx = (ev.clientX - rect.left) / rect.width * 65535, wy = (ev.clientY - rect.top) / rect.height * 65535;
  const { A, N } = S.rec; const off = S.frame * N; let best = -1, bd = Infinity;
  for (let i = 0; i < N; i++) {
    const idx = off + i; if (!(A.flags[idx] & 128)) continue;
    const dx = A.pos[2 * idx] - wx, dy = A.pos[2 * idx + 1] - wy, d = dx * dx + dy * dy;
    if (d < bd) { bd = d; best = idx; }
  }
  const limit = (20 / 1024 * 65535) ** 2;
  S.sel = best >= 0 && bd < limit ? A.uid[best] : null;
  draw();
});

function tick(t) {
  if (S.playing && S.rec) {
    S.acc += (t - (S.last || t)) / (1000 / 30) * S.speed;
    const adv = Math.floor(S.acc);
    if (adv > 0) { S.acc -= adv; S.frame = (S.frame + adv) % S.rec.F; draw(); }
  }
  S.last = t; requestAnimationFrame(tick);
}

function togglePlay() { S.playing = !S.playing; $("play").textContent = S.playing ? "❚❚" : "▶"; }
function stepBy(d) { if (!S.rec) return; S.frame = (S.frame + d + S.rec.F) % S.rec.F; draw(); }
$("play").onclick = togglePlay;
$("back").onclick = () => stepBy(-1);
$("fwd").onclick = () => stepBy(1);
$("speed").onchange = (e) => { S.speed = parseFloat(e.target.value); };
$("scrub").oninput = (e) => { S.frame = parseInt(e.target.value, 10); draw(); };
$("rec").onchange = (e) => loadRecording(e.target.value);
for (const id of ["color", "showRes", "showSig", "showAct", "showChem"]) $(id).onchange = draw;
document.addEventListener("keydown", (e) => {
  if (e.target.tagName === "SELECT") return;
  if (e.code === "Space") { e.preventDefault(); togglePlay(); }
  if (e.code === "ArrowRight") stepBy(1);
  if (e.code === "ArrowLeft") stepBy(-1);
});

// ------------------------------------------------------------------ gráficas
const CHARTS = [
  { title: "Población", series: [["population", "#5fd4c4"]] },
  { title: "Muertes por época", series: [["deaths_starvation", "#c9a227", "hambre"], ["deaths_attack", "#ff6b5a", "mordisco"], ["deaths_age", "#9aa7b4", "vejez"]] },
  { title: "Neuronas ocultas (media)", series: [["hidden_mean", "#b49cff"]] },
  { title: "Gen de ataque (media)", series: [["attack_gene_mean", "#ff6b5a"]] },
  { title: "Archivo de novedad", series: [["archive_size", "#8be38f"]] },
  { title: "Grupos conductuales (silueta)", series: [["groups_silhouette", "#ffd166"]], ref: 0.3 },
  { title: "Valor del aprendizaje", series: [["learning_value", "#5fd4c4"]], points: true, ref: 0 },
  { title: "Comunicación (bits)", series: [["comm_mi_bits", "#78beff"]] },
  { title: "Clados vivos", series: [["clades_alive", "#e79bd6"]] },
  { title: "Emisión de sustancias", series: [["emit_nutrient", "#ffd166", "nutriente"], ["emit_toxin", "#ff6b5a", "toxina"], ["emit_pheromone", "#78beff", "feromona"]] },
  { title: "Ingesta tóxica (fracción)", series: [["toxic_intake_frac", "#ffd166"]] },
  { title: "Muertes por veneno", series: [["deaths_poison", "#c77dff"]] },
];

async function loadStats() {
  let rows = [];
  try { rows = await json("/data/stats/summary.json"); } catch { return; }
  const host = $("charts"); host.innerHTML = "";
  for (const c of CHARTS) {
    const div = document.createElement("div"); div.className = "chart";
    const last = [...rows].reverse().find((r) => r[c.series[0][0]] != null);
    const lastVal = last ? Number(last[c.series[0][0]]) : null;
    div.innerHTML = `<h3>${c.title}<b>${lastVal == null ? "—" : (Math.abs(lastVal) < 10 ? lastVal.toFixed(3) : Math.round(lastVal))}</b></h3><canvas></canvas>`;
    host.appendChild(div);
    drawChart(div.querySelector("canvas"), rows, c);
  }
}

function drawChart(cv, rows, c) {
  const dpr = window.devicePixelRatio || 1; const w = cv.clientWidth, h = cv.clientHeight;
  cv.width = w * dpr; cv.height = h * dpr; const g = cv.getContext("2d"); g.scale(dpr, dpr);
  const pts = c.series.map(([k]) => rows.filter((r) => r[k] != null).map((r) => [r.epoch, Number(r[k])]));
  const all = pts.flat(); if (!all.length) { g.fillStyle = "#7d93a6"; g.font = "12px system-ui"; g.fillText("sin datos aún", 8, h / 2); return; }
  let x0 = Math.min(...all.map((p) => p[0])), x1 = Math.max(...all.map((p) => p[0]));
  let y0 = Math.min(...all.map((p) => p[1]), c.ref ?? Infinity), y1 = Math.max(...all.map((p) => p[1]), c.ref ?? -Infinity);
  if (x1 === x0) x1 = x0 + 1; if (y1 === y0) { y1 += 1; y0 -= 1; }
  const pad = { l: 4, r: 4, t: 6, b: 14 };
  const X = (x) => pad.l + (x - x0) / (x1 - x0) * (w - pad.l - pad.r);
  const Y = (y) => h - pad.b - (y - y0) / (y1 - y0) * (h - pad.t - pad.b);
  g.strokeStyle = "#1b2c3b"; g.lineWidth = 1; g.beginPath(); g.moveTo(pad.l, h - pad.b); g.lineTo(w - pad.r, h - pad.b); g.stroke();
  if (c.ref != null) { g.setLineDash([3, 3]); g.strokeStyle = "#3b5466"; g.beginPath(); g.moveTo(pad.l, Y(c.ref)); g.lineTo(w - pad.r, Y(c.ref)); g.stroke(); g.setLineDash([]); }
  c.series.forEach(([, col], i) => {
    g.strokeStyle = col; g.fillStyle = col; g.lineWidth = 1.5;
    if (c.points) { for (const [x, y] of pts[i]) { g.beginPath(); g.arc(X(x), Y(y), 2.5, 0, 2 * Math.PI); g.fill(); } }
    else { g.beginPath(); pts[i].forEach(([x, y], j) => (j ? g.lineTo(X(x), Y(y)) : g.moveTo(X(x), Y(y)))); g.stroke(); }
  });
  g.fillStyle = "#7d93a6"; g.font = "10px ui-monospace, monospace";
  g.fillText(`ép. ${x0}`, pad.l, h - 2); const t = `ép. ${x1}`; g.fillText(t, w - pad.r - g.measureText(t).width, h - 2);
  if (c.series.length > 1) { let lx = pad.l + 40; c.series.forEach(([, col, name]) => { g.fillStyle = col; g.fillText(name, lx, h - 2); lx += g.measureText(name).width + 10; }); }
}

window.addEventListener("resize", () => loadStats());
loadRun().catch((e) => { $("runmeta").textContent = "error: " + e.message; });
requestAnimationFrame(tick);
</script>
</body>
</html>
